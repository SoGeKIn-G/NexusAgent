# ---------------------------------------------------------------------------
# Tuned for a 7.4 GB / 6-core machine. Do not raise the heap without reason:
# Android Studio (~1.5 GB) + Gradle daemon (2 GB) + Kotlin daemon already
# account for roughly 5 GB of available RAM.
# ---------------------------------------------------------------------------
# Metaspace raised from 512m: with five modules plus KSP and the Compose compiler, the
# daemon was expiring mid-build and restarting, which costs far more than the extra RAM.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.daemon.jvmargs=-Xmx1g

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9+ compiles Kotlin without the separate Kotlin Android plugin.
# Setting this to false is a temporary escape hatch that stops working in AGP 10.
android.builtInKotlin=true
